#
# The whole self-host story: `docker compose up`, no cloud account.
# Every backing service here is open source — Postgres, RabbitMQ, and OpenBao
# (OpenBao is the MPL-2.0 Linux Foundation fork of Vault, which relicensed away from
# open source at v1.15).
#
# Credentials below come from .env and default to dev-only values. They are fine
# for a laptop and NOT fine for anything reachable from a network — a real
# self-host deployment overrides every one of them.
#
# Only the API publishes a host port. Postgres, RabbitMQ and OpenBao talk to it
# over the compose network and stay off the host entirely, so a machine that
# already runs a local Postgres on 5432 (common) doesn't have to configure
# anything for `docker compose up` to work. To reach them from the host — psql,
# the RabbitMQ management UI — add the overlay:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev-ports.yml up

name: dbr

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbr_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-dbr}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbr} -d ${POSTGRES_DB:-dbr}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    # Pinned so the Erlang node keeps a stable name across recreates. Without it
    # the node is rabbit@<random-container-id>, and since Mnesia stores state
    # under a per-node directory, every `compose up` would start an empty node
    # alongside the old one — the volume persists, but nothing in it is ever read
    # again. Definitions and durable queues silently vanish.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dbr}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dbr_dev_password}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  openbao:
    image: openbao/openbao:2
    # Persistent file storage, not `server -dev`. Dev mode keeps the barrel in
    # memory, so every restart destroys the per-tenant DEKs while the ciphertext
    # they protect survives in Postgres — undecryptable, and silently so.
    command: server -config=/openbao/config/openbao.hcl
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - openbao-data:/openbao/file
      - ./openbao/config:/openbao/config:ro
    # No IPC_LOCK: OpenBao 2.x dropped mlock entirely, so the capability would
    # buy nothing. See the note in openbao/config/openbao.hcl.
    healthcheck:
      # A sealed server is up and answering — it just needs unsealing, which is
      # openbao-init's job. `bao status` exits 2 when sealed, 0 when unsealed,
      # 1 when unreachable; only 1 means unhealthy here.
      test: ["CMD-SHELL", "bao status >/dev/null 2>&1 || [ $$? -eq 2 ]"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # One-shot: initializes the barrel on first run, unseals it on every run, and
  # ensures Transit and the well-known local token exist. Same shape as the migrator
  # below — the API and Worker wait for it to exit 0.
  openbao-init:
    image: openbao/openbao:2
    restart: "no"
    environment:
      BAO_ADDR: http://openbao:8200
      DEV_TOKEN: ${BAO_TOKEN:-dbr_dev_api_token}
    volumes:
      - ./openbao/init.sh:/init.sh:ro
      # The policy the application's token is scoped to. Read-only, and read from the
      # repository rather than baked in, so the file under review is the one applied.
      - ./openbao/policies:/policies:ro
      # Unseal key and root token land here, on the host, gitignored. Local-dev
      # convenience only — see the warning at the top of init.sh.
      - ./.openbao:/keys
    entrypoint: ["/bin/sh", "/init.sh"]
    depends_on:
      openbao:
        condition: service_healthy

  # One-shot: issues a development certificate authority, a server certificate for the
  # API's internal listener, and a client certificate for the worker. Idempotent, and it
  # reissues when they are about to expire.
  #
  # It runs on the postgres image, which is already pulled for this stack and carries
  # openssl. Adding an image for three certificates would be one more thing to pin, one
  # more registry to depend on, and one more supply chain to trust — for a tool that is
  # already sitting there.
  pki-init:
    image: postgres:17
    restart: "no"
    volumes:
      - ./pki/init.sh:/init.sh:ro
      # Keys and certificates land here, on the host, gitignored. Local-dev convenience
      # only — see the warning at the top of init.sh.
      - ./.pki:/pki
    entrypoint: ["/bin/sh", "/init.sh"]

  # One-shot: applies db/migrations/core then db/migrations/vault and exits. The only
  # thing in the system that ever changes the schema. API and Worker gate on it
  # completing successfully, so `docker compose up` migrates before either service
  # accepts traffic and there is no manual step. A hosted deployment runs this same
  # image once as a pre-deploy step instead — never on app boot, because several
  # replicas would otherwise race to migrate the same database at once.
  migrator:
    build:
      context: .
      dockerfile: src/Dbr.Migrator/Dockerfile
    restart: "no"
    environment:
      # Both stores point at the same database today; the vault is a schema within it.
      # Because it has its own connection string and its own migration journal, moving
      # it to a database of its own later is a change to this one line.
      ConnectionStrings__Core: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-dbr};Username=${POSTGRES_USER:-dbr};Password=${POSTGRES_PASSWORD:-dbr_dev_password}
      ConnectionStrings__Vault: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-dbr};Username=${POSTGRES_USER:-dbr};Password=${POSTGRES_PASSWORD:-dbr_dev_password}
    depends_on:
      postgres:
        condition: service_healthy

  # The curated catalog, applied after the schema exists and before anything serves
  # traffic. Separate from the migrator because DbUp journals each script and never runs
  # it again, while catalog content changes on its own schedule and has to be reapplied
  # every deploy — the same reconciliation, run afresh each time.
  catalog-sync:
    build:
      context: .
      dockerfile: src/Dbr.CatalogSync/Dockerfile
    restart: "no"
    environment:
      # The same variable the migrator reads, and the same role: this writes rows the
      # application is granted SELECT on and nothing more, so it connects as the owner.
      ConnectionStrings__Core: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-dbr};Username=${POSTGRES_USER:-dbr};Password=${POSTGRES_PASSWORD:-dbr_dev_password}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: src/Dbr.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Core: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-dbr};Username=${POSTGRES_USER:-dbr};Password=${POSTGRES_PASSWORD:-dbr_dev_password}
      # The vault store, reached separately even though it is a schema in the same
      # database today. The connection acts as a role that can read the vault schema and
      # nothing else, while the core connection acts as one that cannot read the vault at
      # all — two roles over one credential. Pointing this line at another database is
      # what moving the vault costs.
      ConnectionStrings__Vault: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-dbr};Username=${POSTGRES_USER:-dbr};Password=${POSTGRES_PASSWORD:-dbr_dev_password}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-dbr}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-dbr_dev_password}
      Bao__Address: http://openbao:8200
      Bao__Token: ${BAO_TOKEN:-dbr_dev_api_token}
      # A passkey is bound to the domain it was created for and is offered nowhere
      # else, so these two describe where this instance is reached from a browser
      # rather than where it listens. The defaults match the port mapping below;
      # changing API_PORT means setting PASSKEY_ORIGIN to match, or every ceremony is
      # refused by the browser before the server ever sees it.
      Passkeys__RelyingPartyId: ${PASSKEY_RELYING_PARTY_ID:-localhost}
      Passkeys__Origins__0: ${PASSKEY_ORIGIN:-http://localhost:8080}
      # Signs the access tokens this instance issues, and verifies them coming back.
      # It has no built-in default on purpose: a key compiled into the source would
      # mint valid tokens for every deployment that never replaced it, so the API
      # refuses to start without one rather than starting with a known key. This is a
      # development value like the passwords above and belongs in the same table of
      # things a real deployment has to replace.
      Tokens__SigningKey: ${TOKEN_SIGNING_KEY:-dbr_dev_token_signing_key_do_not_use_in_production}
      # Which terms an account is opened under. Signup records it against the profile
      # it creates, so it is the answer to "what did this person actually agree to"
      # long after the wording has moved on. Set it to whatever names the text this
      # instance serves; the API refuses to start without it, because an acceptance
      # recorded against nothing is worse than no record at all.
      Terms__CurrentVersion: ${TERMS_VERSION:-2026-06-01}
      # Which consent text a grant or revocation is recorded against. A separate
      # document from the terms above, versioned separately, so rewording what the
      # system may do on somebody's behalf does not invalidate their attestation that
      # the identity in their profile is their own. The API refuses to start without
      # it, for the same reason it refuses without the terms version.
      Consent__PolicyVersion: ${CONSENT_POLICY_VERSION:-2026-06-01}
      # How long a scoped release of somebody's identity stays redeemable. Set here
      # rather than left to the built-in default so that it is discoverable: a setting
      # nobody can find is a setting nobody tunes. Raise it only if legs of work are
      # genuinely waiting longer than this for a busy broker's lane, and not by much —
      # a grant that outlives the work it was minted for is a queued message carrying a
      # standing right to decrypt. The API refuses to start above one hour.
      IdentityRelease__Lifetime: ${IDENTITY_RELEASE_LIFETIME:-00:05:00}
      # The second listener, which the workers call and nothing else does. It is not in
      # the ports list below on purpose: it is reachable from inside the compose network
      # and from nowhere on the host, so a mistake in the certificate configuration
      # cannot expose it to the machine the stack is running on.
      #
      # Both ports are named because naming one takes over — Kestrel prefers endpoints
      # configured in code to the addresses the host was launched with, so setting only
      # the internal one would unbind the public one.
      InternalEdge__Enabled: "true"
      InternalEdge__Port: "8443"
      InternalEdge__PublicPort: "8080"
      InternalEdge__ServerCertificatePath: /pki/server.crt
      InternalEdge__ServerKeyPath: /pki/server.key
      # The authority a client certificate has to chain to, and the name it has to
      # carry. The name is the difference between "signed by us" and "is our worker".
      InternalEdge__ClientCertificateAuthorityPath: /pki/ca.crt
      InternalEdge__ClientCertificateCommonName: dbr-worker
    volumes:
      # Read-only, and the API reads its own key plus the authority. It has no business
      # writing here and no need for the worker's key, but a bind mount is the whole
      # directory either way — which is one of several reasons this arrangement is a
      # development convenience rather than a deployment.
      - ./.pki:/pki:ro
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      pki-init:
        condition: service_completed_successfully
      openbao-init:
        condition: service_completed_successfully
      migrator:
        condition: service_completed_successfully
      catalog-sync:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: src/Dbr.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Development}
      ConnectionStrings__Core: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-dbr};Username=${POSTGRES_USER:-dbr};Password=${POSTGRES_PASSWORD:-dbr_dev_password}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-dbr}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-dbr_dev_password}
      # The worker plans the recurring scans, and a scheduled scan checks permission the
      # same way a requested one does — so the process needs to know which consent text
      # this instance serves, exactly as the API does. It must be the same value in both
      # or the two would disagree about what anybody agreed to.
      Consent__PolicyVersion: ${CONSENT_POLICY_VERSION:-2026-06-01}
      # The hour the planner wakes up, UTC. Which day of the month an account's scan lands
      # on is not configurable — it comes from the account id, so the spread across the
      # month cannot be switched off by accident.
      ScanSchedule__DailyAtHourUtc: ${SCAN_SCHEDULE_HOUR_UTC:-2}
      ScanSchedule__Enabled: ${SCAN_SCHEDULE_ENABLED:-true}
      # Planning a run is not the same job as starting one. The schedule above decides who
      # is due; this decides how promptly a run somebody asked for — by hand or on the
      # schedule — is turned into work sitting in each company's lane.
      #
      # The batch is a batch rather than a drain on purpose. Every leg is dispatched
      # carrying a grant that starts expiring immediately, while the lane it waits in still
      # only moves at the pace that company allows — so one wake-up after an outage that
      # planned every waiting run would mostly mint grants that expire before their turn.
      ScanDispatch__Enabled: ${SCAN_DISPATCH_ENABLED:-true}
      ScanDispatch__PollSeconds: ${SCAN_DISPATCH_POLL_SECONDS:-15}
      ScanDispatch__BatchSize: ${SCAN_DISPATCH_BATCH_SIZE:-20}
      # How this instance introduces itself to a company whose site it reads. Change it if
      # you self-host: the link should point at whoever is running this copy, because it is
      # the only way an operator seeing the traffic can find out what it is and ask about it.
      #
      # The timeout is short because a leg holds a decryption grant while it runs, so a
      # company that has stopped answering should fail quickly rather than keep one open.
      Search__UserAgent: ${SEARCH_USER_AGENT:-LoseMyNumber/1.0 (+https://github.com/mveregge23/lose-my-number-api)}
      Search__TimeoutSeconds: ${SEARCH_TIMEOUT_SECONDS:-20}
      # No key-manager credentials and no vault connection string, deliberately. Workers
      # talk to third-party broker sites, and either of those is a standing decryption
      # right — exactly what a compromised worker should not be able to hand over. When a
      # worker needs a tenant's fields it asks for a short-lived, single-job release of
      # only those fields, and the service holding both decides whether to grant it.
      #
      # These settings are that asking, and they are the whole of it: an address, a
      # certificate saying which machine this is, and the authority that certificate's
      # counterpart has to chain to. Nothing here can decrypt anything on its own.
      InternalApi__Enabled: "true"
      InternalApi__BaseAddress: https://api:8443
      InternalApi__ClientCertificatePath: /pki/worker.crt
      InternalApi__ClientKeyPath: /pki/worker.key
      # The worker checks the listener as strictly as the listener checks the worker.
      # Without this the handshake would be one-directional in practice, and anything
      # that could occupy the address would be handed a grant token.
      InternalApi__ServerCertificateAuthorityPath: /pki/ca.crt
    volumes:
      - ./.pki:/pki:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      pki-init:
        condition: service_completed_successfully
      openbao-init:
        condition: service_completed_successfully
      migrator:
        condition: service_completed_successfully
      catalog-sync:
        condition: service_completed_successfully

volumes:
  postgres-data:
  rabbitmq-data:
  openbao-data:
