A results page holding exactly one listing. The markup is deliberately ordinary: a
container, a repeated result block, and the fields inside it labelled the way a
people-search site labels them. A recipe reads this with selectors, so what matters is that
the structure is nameable and stable, not that it is pretty.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Search results for Alex Whitfield — Example People Finder</title>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">Example People Finder</a>
  </header>

  <main>
    <h1 class="results-heading">1 result for &ldquo;Alex Whitfield&rdquo;</h1>

    <ol class="results" data-result-count="1">
      <li class="result" data-profile-id="ep-8814720">
        <a class="result-name" href="/profile/ep-8814720">Alex Whitfield</a>
        <span class="result-age">Age 41</span>
        <div class="result-location">
          <span class="result-city">Sacramento</span>,
          <span class="result-state">CA</span>
        </div>
        <div class="result-addresses">
          <span class="result-address">12 Rowan Lane, Sacramento, CA 95814</span>
        </div>
        <div class="result-relatives">
          <span class="result-relative">Marian Whitfield</span>
        </div>
      </li>
    </ol>
  </main>

  <footer class="site-footer">
    <a href="/opt-out">Remove my information</a>
  </footer>
</body>
</html>
