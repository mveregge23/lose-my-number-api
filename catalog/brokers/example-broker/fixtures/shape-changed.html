The redesign. Same site, same results, and not one of the names a recipe was written
against: `results` became `sr-list`, `result` became `sr-card`, `result-name` became
`sr-card__title`.

This is the scenario that separates a recipe that has stopped working from a company that
holds nothing, and getting the two the wrong way round is expensive in both directions —
report this as "nothing found" and somebody is told they are not listed on a page that
plainly lists them; report an empty results page as a changed shape and every clean answer
raises a catalog issue. The tell a recipe should be written to use is here on purpose: the
count in the heading disagrees with the number of blocks it managed to parse.
-->

</body>
</html>
