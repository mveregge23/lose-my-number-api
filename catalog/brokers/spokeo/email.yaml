#
# Where Spokeo takes a removal by mail. Read from https://www.spokeo.com/optout on
# 2026-09-15: "Our customer care representatives are available to assist you here, or you
# can email us directly at privacy@spokeo.com."
#
# The local part only. The domain comes from the company's row, so this document cannot
# send anybody's details anywhere but to the company it sits beside.

brokerId: edea346d-25ab-4eab-a9b7-d9b4c6132625
description: >
  Spokeo's privacy mailbox, named on its opt-out page as the direct alternative to the
  removal form.

mailbox: privacy

# How Spokeo's answers are recognised, read from the two it sent on 2026-09-21 in reply to
# the first demand this project made for real.
#
# Both were automated and neither answered the message it was replying to: one is the
# boilerplate the privacy mailbox sends to everything, the other a ticket receipt. What
# makes them worth declaring is the sentence about a request nobody replies to being
# considered resolved — a company that closes a request on the requester's silence is one
# whose demands must not sit here reading as "waiting" while that clock runs.
#
# Nothing is declared under `confirmed`. No answer this project has seen from Spokeo says a
# listing has been removed, and inventing the sentence a company might use to say so is
# exactly the guess that would mark a demand honoured that nobody acted on. It gets filled
# in when a real confirmation arrives and can be read.
replies:
  needsUs:
    - "respond with confirmation that you are the person listed"
    - "we will consider your request resolved"
    - "please provide them in your response"
