What Spokeo serves when nobody by that name is listed: a 404, and a page saying "Your
search - … - did not match any results." The status is declared in fixtures.yaml, because
it is half of what this page means — read as HTTP alone it is a search page that has moved,
and the classification tag in the head is what the recipe reads to know better. Trimmed and
rewritten as the others are.
-->
